.fondo { z-index: 5; }

/* === FADE-IN de los Wallpapers === */
.fondo {

<audio id="perfil-music" autoplay hidden>

<script>
document.addEventListener("DOMContentLoaded", () => {
  const audio = document.getElementById("perfil-music");

  // Volumen inicial = 0 (silencio)
  audio.volume = 0.0;

  // Volumen final (ajústalo entre 0.0 y 1.0 → 1.0 = 100%)
  const volumenFinal = 0.7;  // = 70%
  const duracionFade = 3000; // = 3 segundos

  // Segundo Desde el cual Quieres Empezar
  const inicioEnSegundos = 154; // Cambia este Valor a Donde Quieres que Empiece la Canción

  // Forzar que Inicie Desde ese Segundo
  audio.currentTime = inicioEnSegundos;

  // Cuando Termine, que Vuelva a Empezar Desde 0
  audio.addEventListener("ended", () => {
    audio.currentTime = 0;
    audio.play();
  });

  // Aseguramos que Empiece a Reproducir (por Autoplay Algunas Veces hay Bloqueo)
  audio.play().catch(err => console.log("Autoplay bloqueado:", err));

  // Animación de Fade in Progresivo
  let start = null;
  function fadeStep(timestamp) {
    if (!start) start = timestamp;
    let progreso = (timestamp - start) / duracionFade;
    if (progreso < 1) {
      audio.volume = volumenFinal * progreso;
      requestAnimationFrame(fadeStep);
    } else {
      audio.volume = volumenFinal;
    }
  }
  requestAnimationFrame(fadeStep);
});
</script>

  <script>
  document.addEventListener("DOMContentLoaded", () => {
    const audio = document.getElementById("perfil-music");
    if (!audio) return;

    // Volumen Inicial = 0 (silencio)
    audio.volume = 0.0;

    // Volumen Final (0.0 a 1.0)
    const volumenFinal = 0.7;  // 70%
    const duracionFade = 3000; // 3 segundos

    // Iniciar Reproducción
    audio.play().catch(err => console.log("Autoplay bloqueado:", err));

    // Animación de fade in
    let start = null;
    function fadeStep(timestamp) {
      if (!start) start = timestamp;
      let progreso = (timestamp - start) / duracionFade;
      if (progreso < 1) {
        audio.volume = volumenFinal * progreso;
        requestAnimationFrame(fadeStep);
      } else {
        audio.volume = volumenFinal;
      }
    }
    requestAnimationFrame(fadeStep);
  });

// Asegura Reproducción con la Primera Interacción
document.addEventListener("click", () => {
  const audio = document.getElementById("perfil-music");
  if (audio && audio.paused) {
    audio.play();
  }
}, { once: true });

  document.addEventListener("DOMContentLoaded", () => {
    const overlay = document.querySelector(".overlay-hover");
    const zona = document.querySelector(".overlay-zona");
    if (!overlay || !zona) return;

    const normalSrc = overlay.getAttribute("src");
    const hoverSrc = overlay.getAttribute("data-hover");

    zona.addEventListener("mouseenter", () => {
      overlay.src = hoverSrc;
    });

    zona.addEventListener("mouseleave", () => {
      overlay.src = normalSrc;
    });
  });

document.addEventListener("DOMContentLoaded", () => {
  const firmaImg = document.getElementById("firma-img");
  setTimeout(() => {
    firmaImg.classList.add("visible");

});

// === FADE-IN Independiente de Wallpapers ===
document.addEventListener("DOMContentLoaded", () => {
  const fondos = document.querySelectorAll(".fondo");

  // Configura Aquí El Tiempo (en Milisegundos) para Cada Wallpaper
  const tiempos = [
    6000, // ⬅️ 1er Wallpaper Aparece a los 2s
    6000  // ⬅️ 2do Wallpaper Aparece a los 6s
  ];

  fondos.forEach((fondo, index) => {
    setTimeout(() => {
      fondo.classList.add("visible");
    }, tiempos[index] || 2000); // usa 2000ms Si No Hay Tiempo Definido
  });
});

</script>

    effect: "blink"
  }, "*");

  // === Receptor de imágenes desde perfiles ===
  window.addEventListener("message", (event) => {
    if(event.data.type === "set-slot") {
      const slot = document.getElementById("perfil-slot-" + event.data.index);
      if (slot) {
        slot.innerHTML = `<img src="${event.data.url}" alt="perfil img">`;
        const img = slot.querySelector("img");

        // Hover opcional
        if(event.data.hover) {
          img.addEventListener("mouseenter", () => img.src = event.data.hover);
          img.addEventListener("mouseleave", () => img.src = event.data.url);
        }

        // Click opcional
        if(event.data.onclick) {
          img.style.cursor = "pointer";
          img.style.pointerEvents = "auto";
          img.addEventListener("click", () => window.open(event.data.onclick, "_blank"));
        }

        // Posición y tamaño (si vienen en el mensaje)
        if (event.data.top) slot.style.top = event.data.top;
        if (event.data.left) slot.style.left = event.data.left;
        if (event.data.width) slot.style.width = event.data.width;
        if (event.data.height) slot.style.height = event.data.height;
        slot.style.position = "absolute";
        slot.style.pointerEvents = "auto"; // activa clicks en la zona
      }
    }
  });
});

</script>
